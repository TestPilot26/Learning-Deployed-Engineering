<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1024" height="640" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Chrome Browser Top Bar -->
  <rect width="1024" height="76" rx="12" fill="#f1f5f9"/>
  <circle cx="22" cy="22" r="6" fill="#ef4444"/>
  <circle cx="42" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="22" r="6" fill="#10b981"/>
  <!-- Browser Tab -->
  <rect x="90" y="8" width="220" height="28" rx="8" fill="#ffffff"/>
  <text x="108" y="26" fill="#0f172a" font-size="12" font-weight="600">My Local Web App (localhost)</text>
  <!-- URL Bar -->
  <rect x="16" y="42" width="992" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="60" fill="#475569" font-size="12">↻</text>
  <text x="64" y="60" fill="#0f172a" font-size="12.5" font-family="monospace">http://localhost:8000/#stop/downloading-the-tools</text>
  <text x="770" y="60" fill="#64748b" font-size="11.5">Cmd+Shift+R = Hard Refresh</text>

  <!-- Left Half: Live Webpage Viewport (with Inspected Element Highlight) -->
  <rect x="0" y="76" width="440" height="564" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="112" fill="#0f172a" font-size="18" font-weight="700">The vibes --&gt; deployed Eng</text>
  <text x="24" y="136" fill="#475569" font-size="12.5">Live browser preview running on your computer</text>

  <!-- Highlighted Inspected Button with Blue Box Model Overlay -->
  <rect x="20" y="156" width="396" height="84" rx="8" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="34" y="172" width="188" height="38" rx="8" fill="#2563eb"/>
  <text x="52" y="196" fill="#ffffff" font-size="13" font-weight="700">Ask pipeline guide</text>
  <rect x="22" y="138" width="248" height="20" rx="4" fill="#1e293b"/>
  <text x="30" y="152" fill="#93c5fd" font-size="11" font-family="monospace">button.ask-btn  |  188 × 38 px</text>

  <rect x="24" y="260" width="392" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="288" fill="#0f172a" font-size="14" font-weight="700">How Chrome DevTools helps you</text>
  <text x="40" y="312" fill="#475569" font-size="12">Right-click any element on any webpage and click</text>
  <text x="40" y="330" fill="#1d4ed8" font-size="12" font-weight="700">"Inspect" (or press Cmd+Option+I / F12)</text>
  <text x="40" y="352" fill="#475569" font-size="12">to see its HTML, live-test CSS, read JS errors,</text>
  <text x="40" y="370" fill="#475569" font-size="12">and inspect every API network request.</text>

  <!-- Right Half: Chrome DevTools Dock (x=440..1024) -->
  <rect x="440" y="76" width="584" height="564" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- DevTools Top Tab Bar -->
  <rect x="440" y="76" width="584" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- Inspect Element Icon & Device Toggle Icon -->
  <rect x="448" y="82" width="26" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="454" y="99" fill="#1d4ed8" font-size="13" font-weight="700">↖</text>
  <rect x="480" y="82" width="28" height="24" rx="4" fill="#e2e8f0"/>
  <text x="486" y="98" fill="#334155" font-size="12" font-weight="700">📱</text>

  <text x="522" y="99" fill="#1d4ed8" font-size="12.5" font-weight="700">Elements</text>
  <rect x="518" y="109" width="60" height="3" fill="#1d4ed8"/>
  <text x="594" y="99" fill="#b91c1c" font-size="12.5" font-weight="700">Console (1)</text>
  <text x="684" y="99" fill="#0f172a" font-size="12.5" font-weight="700">Network</text>
  <text x="756" y="99" fill="#475569" font-size="12.5" font-weight="600">Sources</text>
  <text x="824" y="99" fill="#0f172a" font-size="12.5" font-weight="700">Application</text>
  <text x="912" y="99" fill="#475569" font-size="12.5" font-weight="600">Lighthouse</text>

  <!-- Section 1: Elements (DOM + CSS Styles) -->
  <rect x="452" y="122" width="320" height="136" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="464" y="142" fill="#64748b" font-size="11" font-weight="700">ELEMENTS (HTML DOM TREE)</text>
  <text x="464" y="162" fill="#7c3aed" font-size="11.5" font-family="monospace">&lt;main class="main-content"&gt;</text>
  <text x="478" y="182" fill="#7c3aed" font-size="11.5" font-family="monospace">&lt;div class="surface-card"&gt;</text>
  <rect x="484" y="190" width="276" height="22" rx="4" fill="#dbeafe"/>
  <text x="490" y="205" fill="#1e3a8a" font-size="11.5" font-weight="700" font-family="monospace">&lt;button class="ask-btn"&gt;Ask...&lt;/button&gt;</text>
  <text x="478" y="226" fill="#7c3aed" font-size="11.5" font-family="monospace">&lt;/div&gt;</text>
  <text x="464" y="244" fill="#7c3aed" font-size="11.5" font-family="monospace">&lt;/main&gt;</text>

  <rect x="780" y="122" width="232" height="136" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="792" y="142" fill="#64748b" font-size="11" font-weight="700">STYLES (LIVE CSS EDITOR)</text>
  <text x="792" y="162" fill="#0f172a" font-size="11.5" font-family="monospace">.ask-btn {</text>
  <text x="804" y="180" fill="#0369a1" font-size="11" font-family="monospace">background: var(--color-primary);</text>
  <text x="804" y="198" fill="#0369a1" font-size="11" font-family="monospace">padding: 8px 16px;</text>
  <text x="804" y="216" fill="#0369a1" font-size="11" font-family="monospace">border-radius: 999px;</text>
  <text x="792" y="234" fill="#0f172a" font-size="11.5" font-family="monospace">}</text>

  <!-- Section 2: Network Tab (API Requests & Status Codes + Disable Cache) -->
  <rect x="452" y="268" width="560" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="452" y="268" width="560" height="28" rx="6" fill="#f1f5f9"/>
  <text x="464" y="286" fill="#0f172a" font-size="11.5" font-weight="700">NETWORK TAB — Every HTTP / API request &amp; status code</text>
  <rect x="818" y="272" width="182" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="828" y="286" fill="#1d4ed8" font-size="11" font-weight="700">☑ Disable cache (fresh files)</text>

  <text x="464" y="314" fill="#64748b" font-size="11" font-weight="700">NAME (ENDPOINT)</text>
  <text x="640" y="314" fill="#64748b" font-size="11" font-weight="700">METHOD</text>
  <text x="720" y="314" fill="#64748b" font-size="11" font-weight="700">STATUS</text>
  <text x="830" y="314" fill="#64748b" font-size="11" font-weight="700">TIME</text>
  <text x="905" y="314" fill="#64748b" font-size="11" font-weight="700">PAYLOAD / PREVIEW</text>

  <rect x="458" y="322" width="548" height="24" rx="4" fill="#f0fdf4"/>
  <text x="466" y="338" fill="#166534" font-size="11.5" font-family="monospace">/api/ask-guide</text>
  <text x="640" y="338" fill="#166534" font-size="11.5" font-family="monospace">POST</text>
  <text x="720" y="338" fill="#15803d" font-size="11.5" font-weight="700" font-family="monospace">200 OK</text>
  <text x="830" y="338" fill="#166534" font-size="11.5" font-family="monospace">380 ms</text>
  <text x="905" y="338" fill="#166534" font-size="11" font-family="monospace">{answer: "..."}</text>

  <rect x="458" y="350" width="548" height="24" rx="4" fill="#fef2f2"/>
  <text x="466" y="366" fill="#991b1b" font-size="11.5" font-weight="700" font-family="monospace">/api/save-note</text>
  <text x="640" y="366" fill="#991b1b" font-size="11.5" font-family="monospace">POST</text>
  <text x="720" y="366" fill="#dc2626" font-size="11.5" font-weight="700" font-family="monospace">500 Error</text>
  <text x="830" y="366" fill="#991b1b" font-size="11.5" font-family="monospace">42 ms</text>
  <text x="905" y="366" fill="#dc2626" font-size="11" font-family="monospace">KeyError: 'user'</text>

  <!-- Section 3: Console Drawer & Application Storage -->
  <rect x="452" y="428" width="345" height="196" rx="6" fill="#18181b"/>
  <text x="464" y="448" fill="#f4f4f5" font-size="11.5" font-weight="700">CONSOLE DRAWER — JS logs &amp; red stack traces</text>
  <rect x="462" y="458" width="325" height="52" rx="4" fill="#450a0a" stroke="#dc2626"/>
  <text x="470" y="476" fill="#fca5a5" font-size="11" font-weight="700" font-family="monospace">Uncaught TypeError: Cannot read properties</text>
  <text x="470" y="492" fill="#fca5a5" font-size="11" font-family="monospace">of null (reading 'addEventListener')</text>
  <text x="676" y="505" fill="#93c5fd" font-size="10.5" font-family="monospace">app.js:142</text>
  <text x="464" y="534" fill="#93c5fd" font-size="11.5" font-family="monospace">&gt; document.querySelectorAll('.stop-bubble').length</text>
  <text x="464" y="554" fill="#34d399" font-size="11.5" font-family="monospace">&lt;- 7</text>

  <!-- Application / LocalStorage box -->
  <rect x="805" y="428" width="207" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="815" y="448" fill="#0f172a" font-size="11.5" font-weight="700">APPLICATION ➔ STORAGE</text>
  <text x="815" y="468" fill="#475569" font-size="11" font-weight="600">LocalStorage (localhost:8000)</text>
  <rect x="815" y="478" width="187" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="821" y="494" fill="#0f172a" font-size="10.5" font-family="monospace">theme: "light"</text>
  <rect x="815" y="508" width="187" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="821" y="524" fill="#0f172a" font-size="10.5" font-family="monospace">activity_stop1_0: "1"</text>
  <text x="815" y="556" fill="#475569" font-size="10.5">Cookies &amp; Session Tokens</text>
  <rect x="815" y="564" width="187" height="24" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="821" y="580" fill="#166534" font-size="10.5" font-family="monospace">session_id (HttpOnly ✓)</text>
</svg>