<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1024" height="640" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Top Bar -->
  <rect width="1024" height="52" rx="12" fill="#0f172a"/>
  <circle cx="22" cy="26" r="6" fill="#ef4444"/>
  <circle cx="42" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="26" r="6" fill="#10b981"/>
  <rect x="92" y="14" width="24" height="24" rx="6" fill="#10b981"/>
  <text x="99" y="31" fill="#0f172a" font-size="14" font-weight="900">⚡</text>
  <text x="126" y="31" fill="#ffffff" font-size="14" font-weight="700">Neon / Supabase Cloud Postgres Studio</text>

  <!-- Branch selector & Connect button -->
  <rect x="456" y="13" width="196" height="26" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="468" y="30" fill="#38bdf8" font-size="12" font-weight="700" font-family="monospace">⎇ Branch: main (Production)</text>

  <rect x="668" y="13" width="166" height="26" rx="6" fill="#065f46" stroke="#10b981"/>
  <text x="680" y="30" fill="#ecfdf5" font-size="12" font-weight="700">🛡 RLS Policies: Enabled</text>

  <rect x="850" y="11" width="154" height="30" rx="6" fill="#10b981"/>
  <text x="866" y="31" fill="#052e16" font-size="12.5" font-weight="800">🔌 Connect (DB URL)</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="52" width="196" height="588" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="12" y="68" width="172" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="24" y="89" fill="#065f46" font-size="12.5" font-weight="700">▦ Table Editor</text>
  <rect x="12" y="110" width="172" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="24" y="131" fill="#1e40af" font-size="12.5" font-weight="700">&gt;_ SQL Editor</text>
  <text x="24" y="168" fill="#475569" font-size="12.5" font-weight="600">🔐 Authentication (Users)</text>
  <text x="24" y="200" fill="#475569" font-size="12.5" font-weight="600">🛡 Row Level Security</text>
  <text x="24" y="232" fill="#475569" font-size="12.5" font-weight="600">⎇ Database Branches</text>
  <text x="24" y="264" fill="#475569" font-size="12.5" font-weight="600">📦 Backups &amp; Point-in-Time</text>

  <text x="20" y="308" fill="#94a3b8" font-size="10.5" font-weight="700">PUBLIC SCHEMA TABLES</text>
  <rect x="12" y="318" width="172" height="28" rx="5" fill="#f1f5f9"/>
  <text x="24" y="336" fill="#0f172a" font-size="12" font-weight="700" font-family="monospace">📄 users (1,428 rows)</text>
  <text x="24" y="366" fill="#475569" font-size="12" font-family="monospace">📄 flashcards (229 rows)</text>
  <text x="24" y="394" fill="#475569" font-size="12" font-family="monospace">📄 study_sessions (842)</text>

  <!-- Main Center Top: Table Editor Spreadsheet View -->
  <rect x="212" y="68" width="796" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="230" y="94" fill="#0f172a" font-size="14" font-weight="700">Table: public.users — Persistent cloud database rows (survives server restarts)</text>
  <rect x="880" y="76" width="112" height="24" rx="5" fill="#10b981"/>
  <text x="894" y="92" fill="#052e16" font-size="11.5" font-weight="700">+ Insert row</text>

  <!-- Table Header -->
  <rect x="224" y="108" width="772" height="28" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="236" y="126" fill="#334155" font-size="11.5" font-weight="700" font-family="monospace">🔑 id (uuid PK)</text>
  <text x="410" y="126" fill="#334155" font-size="11.5" font-weight="700" font-family="monospace">email (text unique)</text>
  <text x="620" y="126" fill="#334155" font-size="11.5" font-weight="700" font-family="monospace">role (text)</text>
  <text x="760" y="126" fill="#334155" font-size="11.5" font-weight="700" font-family="monospace">created_at (timestamptz)</text>

  <!-- Rows -->
  <rect x="224" y="136" width="772" height="32" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="236" y="156" fill="#0f172a" font-size="11.5" font-family="monospace">usr_9f8a21c0</text>
  <text x="410" y="156" fill="#0f172a" font-size="11.5" font-family="monospace">lucy@example.com</text>
  <text x="620" y="156" fill="#047857" font-size="11.5" font-weight="700" font-family="monospace">admin</text>
  <text x="760" y="156" fill="#64748b" font-size="11.5" font-family="monospace">2026-09-26 14:20:00+00</text>

  <rect x="224" y="168" width="772" height="32" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="236" y="188" fill="#0f172a" font-size="11.5" font-family="monospace">usr_4b7e19d2</text>
  <text x="410" y="188" fill="#0f172a" font-size="11.5" font-family="monospace">alex@team.org</text>
  <text x="620" y="188" fill="#1d4ed8" font-size="11.5" font-family="monospace">learner</text>
  <text x="760" y="188" fill="#64748b" font-size="11.5" font-family="monospace">2026-09-27 08:11:12+00</text>

  <rect x="224" y="200" width="772" height="32" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="236" y="220" fill="#0f172a" font-size="11.5" font-family="monospace">usr_2c5d88a9</text>
  <text x="410" y="220" fill="#0f172a" font-size="11.5" font-family="monospace">priya@research.io</text>
  <text x="620" y="220" fill="#1d4ed8" font-size="11.5" font-family="monospace">learner</text>
  <text x="760" y="220" fill="#64748b" font-size="11.5" font-family="monospace">2026-09-27 09:45:39+00</text>

  <!-- Bottom Left: SQL Editor -->
  <rect x="212" y="310" width="460" height="310" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="230" y="336" fill="#f8fafc" font-size="13" font-weight="700">SQL Editor — Query or create tables &amp; indexes</text>
  <rect x="576" y="318" width="80" height="24" rx="5" fill="#3b82f6"/>
  <text x="590" y="334" fill="#ffffff" font-size="11.5" font-weight="700">▷ Run SQL</text>

  <text x="230" y="368" fill="#38bdf8" font-size="12" font-family="monospace">SELECT</text>
  <text x="282" y="368" fill="#f8fafc" font-size="12" font-family="monospace">id, email, role, created_at</text>
  <text x="230" y="388" fill="#38bdf8" font-size="12" font-family="monospace">FROM</text>
  <text x="268" y="388" fill="#f8fafc" font-size="12" font-family="monospace">public.users</text>
  <text x="230" y="408" fill="#38bdf8" font-size="12" font-family="monospace">WHERE</text>
  <text x="276" y="408" fill="#a7f3d0" font-size="12" font-family="monospace">role = 'learner'</text>
  <text x="230" y="428" fill="#38bdf8" font-size="12" font-family="monospace">ORDER BY</text>
  <text x="296" y="428" fill="#f8fafc" font-size="12" font-family="monospace">created_at DESC LIMIT 20;</text>

  <rect x="226" y="452" width="432" height="152" rx="6" fill="#1e293b"/>
  <text x="238" y="474" fill="#34d399" font-size="11.5" font-weight="700" font-family="monospace">✓ Success: Returned 2 rows in 3.4 ms (Index Scan)</text>
  <text x="238" y="502" fill="#94a3b8" font-size="11" font-family="monospace">-- Tip: Add an index so 10,000+ user lookups stay fast:</text>
  <text x="238" y="522" fill="#fcd34d" font-size="11" font-family="monospace">CREATE INDEX idx_users_email ON users(email);</text>

  <!-- Bottom Right: Connect Modal (Pooled DATABASE_URL for .env) -->
  <rect x="686" y="310" width="322" height="310" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="704" y="338" fill="#0f172a" font-size="14" font-weight="700">Connect to your database</text>
  <text x="704" y="358" fill="#475569" font-size="11.5">Copy this connection string into your local</text>
  <text x="704" y="374" fill="#0f172a" font-size="11.5" font-weight="700">.env file &amp; Vercel Environment Variables:</text>

  <rect x="704" y="388" width="144" height="24" rx="5" fill="#ecfdf5" stroke="#10b981"/>
  <text x="712" y="404" fill="#065f46" font-size="11" font-weight="700">☑ Connection Pooling</text>

  <rect x="704" y="422" width="286" height="86" rx="6" fill="#0f172a"/>
  <text x="714" y="444" fill="#34d399" font-size="10.5" font-family="monospace"># Paste inside .env (NEVER commit!):</text>
  <text x="714" y="464" fill="#f8fafc" font-size="10.5" font-family="monospace">DATABASE_URL="postgresql://neondb_owner:</text>
  <text x="714" y="482" fill="#f8fafc" font-size="10.5" font-family="monospace">••••••@ep-cool-pooler.us-east-2.aws</text>
  <text x="714" y="498" fill="#f8fafc" font-size="10.5" font-family="monospace">.neon.tech/neondb?sslmode=require"</text>

  <rect x="704" y="520" width="286" height="32" rx="6" fill="#10b981"/>
  <text x="768" y="541" fill="#052e16" font-size="12" font-weight="800">📋 Copy DATABASE_URL</text>
  <text x="704" y="576" fill="#64748b" font-size="11">Pooler ('-pooler') handles 1,000+ serverless</text>
  <text x="704" y="592" fill="#64748b" font-size="11">connections without crashing Postgres.</text>
</svg>